<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виджет Popovers</title>
</head>

<body>

  <div class="container" style="padding: 150px 50px; text-align: center;">

    <button type="button" class="btn" data-popover>
      Кнопка по умолчанию
    </button>

    <button type="button" class="btn" data-popover data-popover-config="{&quot;title&quot;: &quot;Заголовок&quot;, &quot;content&quot;: &quot;Текст подсказки&quot;}">
      Кнопка
    </button>

  </div>

</body>

</html>
